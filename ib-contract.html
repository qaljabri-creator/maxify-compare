<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark" data-build="4">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IB Contract</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- tokens: same palette as the compare page ---------- */
:root{
  color-scheme: dark;
  --ink:#FFFFFF; --ink-2:#7B8AA4; --ink-3:#7B8AA4A6;
  --line:#324462; --line-soft:#32446288;
  --card:#1F2A3C66; --card-hover:#1F2A3CCC;
  --accent:#1AE7EF; --accent-soft:#1AE7EF1F; --accent-ink:#06131A;
  --warn:#FFA655; --warn-soft:#FFA6551A;
  --page:#171F2B;
}
[data-theme="light"]{
  color-scheme: light;
  --ink:#16202E; --ink-2:#5A6B85; --ink-3:#8494AB;
  --line:#DCE3EC; --line-soft:#E7EDF3;
  --card:#FFFFFF99; --card-hover:#FFFFFF;
  --accent:#0A9098; --accent-soft:#0A90981A; --accent-ink:#FFFFFF;
  --warn:#B4650E; --warn-soft:#B4650E14;
  --page:#F5F7FA;
}

*{box-sizing:border-box}
html{background:var(--page)}
body{background:var(--page);margin:0;padding:0;min-height:100vh;
  font-family:"IBM Plex Sans Arabic",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--ink);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}

.wrap{width:100%;max-width:900px;margin:0 auto;padding:18px 16px 28px}

/* ---------- head ---------- */
.head{margin-bottom:22px}
h1{font-size:clamp(20px,2.6vw,26px);font-weight:600;letter-spacing:-.015em;margin:0 0 6px}
.intro{margin:0;color:var(--ink-2);font-size:14px;max-width:70ch;line-height:1.7}

/* ---------- sections ---------- */
#definitions .items li{background:none;border:0;padding:6px 0;border-bottom:1px solid var(--line-soft);border-radius:0}
#definitions .items{gap:0}
section{scroll-margin-top:16px;padding-bottom:26px;margin-bottom:26px;border-bottom:1px solid var(--line-soft)}
section:last-of-type{border-bottom:0;margin-bottom:0}
h2{font-size:17px;font-weight:600;letter-spacing:-.01em;margin:0 0 14px;
  display:flex;align-items:baseline;gap:9px}
h2 .num{font-size:12px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}

.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.items li{
  background:var(--card);border:1px solid var(--line-soft);border-radius:10px;
  padding:12px 14px;font-size:14px;color:var(--ink-2);line-height:1.7;
}
.items li b{color:var(--ink);font-weight:600}
.items li a{color:var(--accent);text-decoration:underline;text-underline-offset:3px}

/* red lines carry their own weight */
.red h2 .num{color:var(--warn)}
.red .items li{background:var(--warn-soft);border-color:transparent;
  border-inline-start:2px solid var(--warn)}

.note{margin-top:14px;font-size:13px;color:var(--ink-2);line-height:1.7}
.note b{color:var(--ink);font-weight:600}

/* commission table */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
@media (max-width:560px){ .grid2{grid-template-columns:1fr} }
.box{background:var(--card);border:1px solid var(--line-soft);border-radius:10px;padding:13px 14px}
.box h3{margin:0 0 8px;font-size:12.5px;font-weight:600;color:var(--ink-3)}
.box p{margin:0;font-size:14px;color:var(--ink);line-height:1.7}
.box.no h3{color:var(--warn)}

.tw{margin:0 0 16px}
.tw figcaption{font-size:12px;font-weight:600;color:var(--ink-3);margin-bottom:8px}
.scroll{overflow-x:auto;border:1px solid var(--line-soft);border-radius:10px;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums;min-width:480px}
th{text-align:start;font-size:11.5px;font-weight:600;color:var(--ink-3);
  padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line-soft);color:var(--ink-2);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td.lv{color:var(--ink);font-weight:600}
td.tot{color:var(--accent);font-weight:600}

.legal{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--ink-3);line-height:1.7}
</style>
</head>
<body>
<div class="wrap">

    <h1 id="title"></h1>
    <p class="intro" id="intro"></p>
  </div>

  <main id="body"></main>

  <p class="legal" id="legal"></p>
</div>

  title:"IB Contract",
  intro:"This agreement is entered into between MaxifyFX, hereinafter the \"Company\", and the Introducing Broker, hereinafter the \"Partner\". It takes effect on the date the agency is activated in the IB Room and remains in force for as long as the agency subsists.",

      items:[

        "<b>Referred client:</b> any client who registered with the Company through the Partner's link or referral code, or who was transferred to the Partner's agency by decision of the Company.",
        "<b>Active client:</b> a referred client who trades five lots or more within a single calendar month.",
        "<b>Level:</b> one of the four grades of agency (Gold, Platinum, Premium and Diamond), determined by the number of active clients in accordance with the Partner Programme document.",
        "<b>Partner Programme document:</b> the document adopted by the Company setting out commission and incentive amounts and promotion conditions, published in the IB Room.",
        "<b>IB Room:</b> the Partner's dashboard within the Company's platform. The data and balances shown in it are authoritative.",
        "<b>Client Agreement:</b> the agreement published on the Company's website governing its relationship with its clients. Its provisions are authoritative as to client trading conduct."
      ]},

    { id:"scope", nav:"Subject matter", h:"Article 1: Subject matter",

        "The Partner Programme document forms an integral part of this agreement as to amounts, rates and numerical conditions. Where the two documents conflict, the provision more favourable to the Partner prevails."
      ]},

/* =========================================================================
   B2CORE embed protocol — identical to the compare page.
   The portal waits for the frame to announce itself, then sends theme + lang.
   ========================================================================= */
const q = new URLSearchParams(location.search);
const B2CORE_ORIGIN = "https://my.maxifyfx.com";

let theme = /light/.test((q.get("theme")||"").toLowerCase()) ? "light" : "dark";
let lang  = (q.get("lang")||"").toLowerCase().slice(0,2) === "en" ? "en" : "ar";

addEventListener("message", e => {
  if (e.origin !== B2CORE_ORIGIN || e.source !== window.parent || !e.data) return;
  const d = e.data;
  if (d.type === "embed-theme-change"){
    const next = d.theme === "light-theme" ? "light" : d.theme === "dark-theme" ? "dark" : null;
    if (next && next !== theme){ theme = next; render(); }
  }
  if (d.type === "embed-language-change"){
    const next = d.lang === "ar" ? "ar" : "en";
    if (next !== lang){ lang = next; render(); }
  }
});

let answered = false;
addEventListener("message", e => { if (e.origin === B2CORE_ORIGIN) answered = true; });
const announce = () => { try{ parent.postMessage({type:"embed-iframe-ready"}, B2CORE_ORIGIN); }catch(e){} };
announce();
[100, 400, 1200].forEach(ms => setTimeout(() => { if (!answered) announce(); }, ms));

/* =========================================================================
   RENDER
   ========================================================================= */
const $ = id => document.getElementById(id);

function render(){
  const D = DOC[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir  = lang === "ar" ? "rtl" : "ltr";
  document.documentElement.dataset.theme = theme;

  $("title").textContent = D.title;
  $("intro").textContent = D.intro;
  $("legal").textContent = D.legal;

  $("body").innerHTML = D.sections.map((s,i) => {
    const lead   = s.lead  ? `<p class="note">${s.lead}</p>` : "";
    const boxes  = s.boxes ? `<div class="grid2">` + s.boxes.map(b =>
        `<div class="box ${b.no?"no":""}"><h3>${b.t}</h3><p>${b.v}</p></div>`).join("") + `</div>` : "";
    const items  = s.items ? `<ul class="items">` + s.items.map(x => `<li>${x}</li>`).join("") + `</ul>` : "";
    const tables = s.tables ? s.tables.map(tb =>
        `<figure class="tw"><figcaption>${tb.cap}</figcaption><div class="scroll"><table>` +
        `<thead><tr>` + tb.head.map(x => `<th>${x}</th>`).join("") + `</tr></thead><tbody>` +
        tb.rows.map(r => `<tr>` + r.map((c,i) =>
          `<td class="${i===0?"lv":""} ${i===r.length-1?"tot":""}">${c}</td>`).join("") + `</tr>`).join("") +
        `</tbody></table></div></figure>`).join("") : "";
    const note   = s.note  ? `<p class="note">${s.note}</p>` : "";
    return `<section id="${s.id}" class="${s.red?"red":""}">
      <h2>${s.h}</h2>
      ${lead}${tables}${boxes}${items}${note}
    </section>`;
  }).join("");
}

console.log("ib-contract build 4 | theme:", theme, "| lang:", lang);
render();
</script>
