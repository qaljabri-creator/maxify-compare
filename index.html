<!-- build 13 -->
<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark" data-build="13">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compare accounts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- tokens ----------
   Mirrors B2CORE's palette. The portal drives the theme over postMessage,
   so the page stays transparent and simply repaints. */
:root{
  color-scheme: dark;
  --ink:#FFFFFF;
  --ink-2:#7B8AA4;
  --ink-3:#7B8AA4A6;
  --line:#324462;
  --line-soft:#32446288;
  --card:#1F2A3C66;
  --card-hover:#1F2A3CCC;
  --accent:#1AE7EF;
  --accent-soft:#1AE7EF1F;
  --accent-ink:#06131A;
  --glow:0 0 0 1px #1AE7EF66, 0 6px 26px -6px #1AE7EF3D;
  --scrim:#0A1018D9;
  --sheet:#1B2534;
  --page:#171F2B;
}
[data-theme="light"]{
  color-scheme: light;
  --ink:#16202E;
  --ink-2:#5A6B85;
  --ink-3:#8494AB;
  --line:#DCE3EC;
  --line-soft:#E7EDF3;
  --card:#FFFFFF99;
  --card-hover:#FFFFFF;
  --accent:#0A9098;
  --accent-soft:#0A90981A;
  --accent-ink:#FFFFFF;
  --glow:0 0 0 1px #0A909866, 0 6px 22px -8px #0A909840;
  --scrim:#16202E4D;
  --sheet:#FFFFFF;
  --page:#F5F7FA;
}

*{box-sizing:border-box}
/* The portal gives the frame container a darker fill than its own page.
   Painting the portal background here makes the embed sit flush with it. */
html{background:var(--page)}
body{background:var(--page);margin:0;padding:0;min-height:100vh}
body{
  font-family:"IBM Plex Sans Arabic",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:12px}

.wrap{width:100%;max-width:1200px;margin:0 auto;padding:18px 16px 22px}

h1{font-size:clamp(20px,2.6vw,26px);font-weight:600;letter-spacing:-.015em;margin:0 0 4px}
.lede{margin:0 0 20px;color:var(--ink-2);font-size:14px;max-width:62ch}

.bar{display:flex;gap:10px;align-items:center;margin-bottom:16px}
.bar[hidden]{display:none}
.bar label{font-size:12.5px;color:var(--ink-3)}
.pick{
  min-width:130px;font:inherit;font-size:12.5px;color:var(--ink);
  background:var(--card-hover);border:1px solid var(--line);border-radius:10px;
  padding:6px 10px;cursor:pointer;
}

/* ---------- cards ----------
   Three per row, so new account types drop in without a layout change. */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;
  list-style:none;margin:0;padding:0}
@media (max-width:900px){ .cards{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:560px){ .cards{grid-template-columns:1fr} }

.card{
  font:inherit;color:inherit;text-align:start;cursor:pointer;width:100%;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:18px 18px 16px;display:flex;flex-direction:column;
  transition:background .18s ease, border-color .18s ease, box-shadow .18s ease, transform .18s ease;
}
.card:hover, .card:focus-visible{
  background:var(--card-hover);
  border-color:transparent;
  box-shadow:var(--glow);
  transform:translateY(-2px);
}
@media (hover:none){ .card:hover{transform:none;box-shadow:none;background:var(--card)} }
@media (prefers-reduced-motion:reduce){ .card{transition:none} .card:hover{transform:none} }

.card-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-name{font-size:17px;font-weight:600;letter-spacing:-.01em}
.mine{font-size:10.5px;font-weight:600;color:var(--accent-ink);background:var(--accent);
  border-radius:999px;padding:2px 8px;white-space:nowrap}

.spec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:8px 0;border-top:1px solid var(--line-soft);font-variant-numeric:tabular-nums}
.spec:first-of-type{border-top:0;padding-top:0}
.spec .k{font-size:12.5px;color:var(--ink-2);flex:none}
.spec .v{font-size:14.5px;font-weight:600;text-align:end}
.spec .v.lead{color:var(--accent)}
.spec .v small{font-weight:400;font-size:12px;color:var(--ink-3);margin-inline-start:4px}

.card-cta{margin-top:14px;font-size:12.5px;font-weight:600;color:var(--accent)}

/* ---------- shared ---------- */
.shared{margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.shared h2{font-size:13.5px;font-weight:600;margin:0 0 12px}
.shared ul{list-style:none;margin:0;padding:0;
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 22px}
@media (max-width:560px){ .shared ul{grid-template-columns:repeat(2,minmax(0,1fr))} }
.shared li{font-size:13px;color:var(--ink-2);display:flex;gap:8px;align-items:baseline}
.shared li::before{content:"";width:5px;height:5px;flex:none;border-radius:50%;
  background:var(--accent);transform:translateY(-2px)}

.legal{margin-top:22px;padding-top:14px;border-top:1px solid var(--line-soft);
  font-size:11.5px;color:var(--ink-3);line-height:1.65}

/* ---------- detail panel ---------- */
dialog{border:0;padding:0;background:transparent;color:var(--ink);max-width:520px;width:calc(100% - 28px)}
dialog::backdrop{background:var(--scrim);backdrop-filter:blur(3px)}
.sheet{position:relative;background:var(--sheet);border:1px solid var(--line);
  border-radius:16px;padding:22px 22px 20px}
.sheet h3{margin:0;font-size:19px;font-weight:600;letter-spacing:-.01em}
.sheet .who{margin:3px 0 16px;color:var(--ink-2);font-size:13.5px}
.close{position:absolute;inset-block-start:14px;inset-inline-end:14px;font:inherit;font-size:18px;
  line-height:1;background:none;border:0;color:var(--ink-3);cursor:pointer;padding:4px 8px;border-radius:8px}
.close:hover{color:var(--ink);background:var(--accent-soft)}

.diff{border-top:1px solid var(--line-soft);margin-bottom:16px}
.diff .row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:baseline;
  padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:13.5px}
.diff .k{color:var(--ink-2);font-size:12.5px}
.diff .from{color:var(--ink-3);text-decoration:line-through;font-size:12.5px;font-variant-numeric:tabular-nums}
.diff .to{font-weight:600;font-variant-numeric:tabular-nums}
.diff .to.lead{color:var(--accent)}
.fullH{margin:18px 0 2px;font-size:12px;font-weight:600;color:var(--ink-3)}
.diff.full .row{grid-template-columns:1fr auto;font-size:13px}
.diff.full .to{font-weight:500}
.sheet{max-height:82vh;overflow:auto}

.note{font-size:12.5px;color:var(--ink-2);background:var(--accent-soft);
  border-inline-start:2px solid var(--accent);padding:10px 12px;
  border-radius:0 8px 8px 0;margin-bottom:16px;line-height:1.6}
[dir="rtl"] .note{border-radius:8px 0 0 8px}
.cta{display:flex;gap:9px;flex-wrap:wrap}
.go{display:inline-flex;justify-content:center;flex:1;min-width:130px;font:inherit;font-size:13px;
  font-weight:600;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;
  padding:11px 14px;cursor:pointer;text-decoration:none}
.go.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.go.ghost:hover{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">

  <h1 id="title"></h1>
  <p class="lede" id="lede"></p>

  <div class="bar" id="testbar">
    <label for="mine" id="mineLbl"></label>
    <select class="pick" id="mine">
      <option value="">—</option>
      <option value="standard">Standard</option>
      <option value="zero">Zero</option>
      <option value="fy">FY</option>
      <option value="ea">EA</option>
    </select>
  </div>

  <ul class="cards" id="cards"></ul>

  <section class="shared">
    <h2 id="sharedH"></h2>
    <ul id="sharedList"></ul>
  </section>

  <p class="legal" id="legal"></p>
</div>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <div class="sheet">
    <button class="close" id="dlgClose" aria-label="Close">&times;</button>
    <h3 id="dlgTitle"></h3>
    <p class="who" id="dlgWho"></p>
    <div class="diff" id="dlgDiff"></div>
    <h4 class="fullH" id="dlgFullH"></h4>
    <div class="diff full" id="dlgFull"></div>
    <div class="note" id="dlgNote"></div>
    <div class="cta">
      <a class="go" id="dlgGo" target="_top"></a>
      <a class="go ghost" id="dlgMore" target="_blank" rel="noopener"></a>
    </div>
  </div>
</dialog>

<script>
/* =========================================================================
   DATA — single source of truth. Add an account here and the grid grows.
   ========================================================================= */
const PLANS = [
  { id:"standard", name:"Standard", deposit:15,   commission:0, spreadFrom:0.6, leverage:300,
    more:"https://www.maxifyfx.com/standard-account" },
  { id:"zero",     name:"Zero",     deposit:4500, commission:7, spreadFrom:0.1, leverage:300, raw:true,
    more:"https://www.maxifyfx.com/zero-account" },
  { id:"fy",       name:"FY",       deposit:1000, commission:4, spreadFrom:0.3, leverage:300,
    more:"https://www.maxifyfx.com/fy-account" },
  { id:"ea",       name:"EA",       deposit:500,  commission:0, spreadFrom:2.0, leverage:100, points:true,
    more:"https://www.maxifyfx.com/ea-account" }
];

const T = {
  ar:{
    title:"المقارنة بين الحسابات",
    lede:"الحسابات تختلف في أربع نقاط فقط. باقي الشروط واحدة عند الجميع. اضغط أي حساب لتشوف تفاصيله.",
    rows:{deposit:"أقل إيداع", commission:"العمولة", spread:"السبريد", leverage:"الرافعة"},
    perLot:"للّوت", noComm:"بدون عمولة", from:"من", points:"نقطة", raw:"+ سبريد خام",
    open:"افتح حساب", page:"صفحة الحساب", details:"التفاصيل", mineLbl:"حسابي الحالي", mine:"حسابك",
    sharedH:"متوفر في كل الحسابات",
    shared:["أصغر لوت 0.01","تنفيذ ECN Direct Market","بدون عمولة سواب","التداول الآلي مدعوم","VPS مدعوم","ميتاتريدر 5","حرية كاملة في إدارة المخاطر"],
    who:{
      standard:"بداية بأقل تكلفة دخول، بدون عمولة على الصفقة.",
      zero:"سبريد خام للمضاربة السريعة، مقابل عمولة ثابتة.",
      fy:"وسط بين السبريد الضيق والعمولة المنخفضة.",
      ea:"مخصص للتداول الآلي والاكسبيرتات."
    },
    fullH:"باقي المواصفات",
    full:[["أصغر لوت","0.01"],["نوع التنفيذ","ECN Direct Market"],["عمولة السواب","بدون"],
          ["التداول الآلي","مدعوم"],["VPS","مدعوم"],["المنصة","ميتاتريدر 5"],["إدارة المخاطر","حرية كاملة"]],
    noteNoMine:"اختر حسابك الحالي من الأعلى لتشوف الفرق مباشرة.",
    noteSame:"هذا هو حسابك الحالي.",
    noteCost:"السبريد الخام يتغير حسب السيولة ووقت الجلسة، فالتكلفة النهائية تعتمد على حجم تداولك وليس على رقم ثابت.",
    legal:"تداول العقود مقابل الفروقات ينطوي على مخاطر عالية وقد يؤدي إلى خسارة رأس المال. الشروط قابلة للتغيير حسب نوع الأداة وظروف السوق."
  },
  en:{
    title:"Compare accounts",
    lede:"The accounts differ on four points only. Everything else is identical. Tap an account for details.",
    rows:{deposit:"Minimum deposit", commission:"Commission", spread:"Spread", leverage:"Leverage"},
    perLot:"per lot", noComm:"None", from:"from", points:"points", raw:"+ raw spread",
    open:"Open account", page:"Account page", details:"Details", mineLbl:"My current account", mine:"Yours",
    sharedH:"Included with every account",
    shared:["0.01 minimum lot","ECN Direct Market execution","No swap commission","Automated trading supported","VPS supported","MetaTrader 5","Full risk-management freedom"],
    who:{
      standard:"Lowest entry cost, no per-trade commission.",
      zero:"Raw spreads for fast scalping, with a fixed commission.",
      fy:"A middle ground between tight spread and low commission.",
      ea:"Built for automated trading and expert advisors."
    },
    fullH:"Everything else",
    full:[["Minimum lot","0.01"],["Execution","ECN Direct Market"],["Swap commission","None"],
          ["Automated trading","Supported"],["VPS","Supported"],["Platform","MetaTrader 5"],["Risk management","Full freedom"]],
    noteNoMine:"Pick your current account above to see the difference.",
    noteSame:"This is your current account.",
    noteCost:"Raw spread moves with liquidity and session, so the final cost depends on your volume rather than one fixed number.",
    legal:"CFD trading carries a high level of risk and can result in the loss of your capital. Conditions vary by instrument and market conditions."
  }
};

/* =========================================================================
   B2CORE embed protocol.
   The portal does not broadcast. It waits for the frame to announce itself,
   then sends the current theme and language, and pushes every later change.
   ========================================================================= */
const q = new URLSearchParams(location.search);
const B2CORE_ORIGIN = "https://my.maxifyfx.com";

const pTheme = (q.get("theme")||"").toLowerCase();
const pLang  = (q.get("lang") ||"").toLowerCase().slice(0,2);
let theme = /light/.test(pTheme) ? "light" : "dark";
let lang  = pLang === "en" ? "en" : "ar";
let mine  = (q.get("account")||"").toLowerCase();
if (q.get("ui") === "clean") document.getElementById("testbar").hidden = true;

addEventListener("message", e => {
  if (e.origin !== B2CORE_ORIGIN || e.source !== window.parent || !e.data) return;
  const d = e.data;
  if (d.type === "embed-theme-change"){
    const next = d.theme === "light-theme" ? "light" : d.theme === "dark-theme" ? "dark" : null;
    if (next && next !== theme){ theme = next; render(); }
  }
  if (d.type === "embed-language-change"){
    const next = d.lang === "ar" ? "ar" : "en";
    if (next !== lang){ lang = next; render(); }
  }
});

/* Announce, then retry briefly in case the portal binds its listener a beat later. */
let answered = false;
addEventListener("message", e => { if (e.origin === B2CORE_ORIGIN) answered = true; });
const announce = () => { try{ parent.postMessage({type:"embed-iframe-ready"}, B2CORE_ORIGIN); }catch(e){} };
announce();
[100, 400, 1200].forEach(ms => setTimeout(() => { if (!answered) announce(); }, ms));

/* =========================================================================
   RENDER
   ========================================================================= */
const $ = id => document.getElementById(id);
const t = () => T[lang];
const plan = id => PLANS.find(p => p.id === id);
const money = n => "$" + n.toLocaleString("en-US");
const KEYS = ["deposit","commission","spread","leverage"];

function fmt(p, key){
  const L = t();
  if (key === "deposit")    return {v: money(p.deposit)};
  if (key === "commission") return p.commission ? {v: money(p.commission), u: L.perLot} : {v: L.noComm};
  if (key === "spread")     return p.points ? {v: p.spreadFrom, u: L.points}
                                            : {v: L.from + " " + p.spreadFrom, u: p.raw ? L.raw : ""};
  return {v: "1:" + p.leverage};
}

/* Mark a value only when it is the single best in its category.
   Ties (three accounts at 1:300) get no marker, or the marker means nothing. */
const RAW = {deposit:p=>p.deposit, commission:p=>p.commission, spread:p=>p.spreadFrom, leverage:p=>p.leverage};
const BEST = {
  deposit:    Math.min(...PLANS.map(RAW.deposit)),
  commission: Math.min(...PLANS.map(RAW.commission)),
  spread:     Math.min(...PLANS.map(RAW.spread)),
  leverage:   Math.max(...PLANS.map(RAW.leverage))
};
const UNIQUE = {};
KEYS.forEach(k => UNIQUE[k] = PLANS.filter(p => RAW[k](p) === BEST[k]).length === 1);
const isLead = (p,k) => UNIQUE[k] && RAW[k](p) === BEST[k];

function render(){
  const L = t();
  document.documentElement.lang = lang;
  document.documentElement.dir  = lang === "ar" ? "rtl" : "ltr";
  document.documentElement.dataset.theme = theme;

  $("title").textContent   = L.title;
  $("lede").textContent    = L.lede;
  $("sharedH").textContent = L.sharedH;
  $("legal").textContent   = L.legal;
  $("mineLbl").textContent = L.mineLbl;
  $("mine").value = mine;

  $("cards").innerHTML = PLANS.map(p => {
    const tag = mine === p.id ? `<span class="mine">${L.mine}</span>` : "";
    const specs = KEYS.map(k => {
      const f = fmt(p,k);
      return `<span class="spec"><span class="k">${L.rows[k]}</span>` +
             `<span class="v ${isLead(p,k)?"lead":""}">${f.v}${f.u?`<small>${f.u}</small>`:""}</span></span>`;
    }).join("");
    return `<li><button class="card" data-open="${p.id}">` +
           `<span class="card-top"><span class="card-name">${p.name}</span>${tag}</span>` +
           specs +
           `<span class="card-cta">${L.details}</span></button></li>`;
  }).join("");

  $("sharedList").innerHTML = L.shared.map(s => `<li>${s}</li>`).join("");
}

/* =========================================================================
   DETAIL PANEL
   ========================================================================= */
function openPlan(id){
  const L = t(), p = plan(id), cur = mine ? plan(mine) : null;
  $("dlgTitle").textContent = p.name;
  $("dlgWho").textContent   = L.who[id];

  $("dlgDiff").innerHTML = KEYS.map(k => {
    const to = fmt(p,k), toTxt = to.v + (to.u ? " " + to.u : "");
    let inner = "";
    if (cur && cur.id !== p.id){
      const f = fmt(cur,k);
      if (f.v + (f.u||"") !== to.v + (to.u||"")) inner = f.v + (f.u ? " " + f.u : "");
    }
    return `<div class="row"><span class="k">${L.rows[k]}</span>` +
           `<span class="from">${inner}</span>` +
           `<span class="to ${isLead(p,k)?"lead":""}">${toTxt}</span></div>`;
  }).join("");

  $("dlgFullH").textContent = L.fullH;
  $("dlgFull").innerHTML = L.full.map(([k,v]) =>
    `<div class="row"><span class="k">${k}</span><span class="to">${v}</span></div>`).join("");

  $("dlgNote").textContent = !cur ? L.noteNoMine : cur.id === p.id ? L.noteSame : L.noteCost;
  $("dlgGo").textContent   = L.open + " " + p.name;
  $("dlgGo").href          = "https://my.maxifyfx.com/" + lang + "/platforms/mt5";
  $("dlgMore").textContent = L.page;
  $("dlgMore").href        = p.more;
  $("dlg").showModal();
}

document.addEventListener("click", e => {
  const o = e.target.closest("[data-open]");
  if (o) openPlan(o.dataset.open);
});
$("mine").addEventListener("change", e => { mine = e.target.value; render(); });
$("dlgClose").addEventListener("click", () => $("dlg").close());
$("dlg").addEventListener("click", e => { if (e.target === $("dlg")) $("dlg").close(); });

console.log("compare-accounts build 13 | theme:", theme, "| lang:", lang);
render();
</script>
</body>
</html>
